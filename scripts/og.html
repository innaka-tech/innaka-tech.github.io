<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,600;0,700;1,500&display=swap"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        background: #0e2a47; color: #f8fafc;
        font-family: 'Plus Jakarta Sans', sans-serif;
        position: relative; padding: 64px;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .grid {
        position: absolute; inset: 0;
        background-image: linear-gradient(to right, rgba(248,250,252,.08) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(248,250,252,.08) 1px, transparent 1px);
        background-size: 96px 96px;
        mask-image: radial-gradient(ellipse at 50% 0%, #000 20%, transparent 70%);
      }
      .orb {
        position: absolute; left: 50%; top: -40%; width: 900px; height: 900px; transform: translateX(-50%);
        border-radius: 999px; filter: blur(80px);
        background: radial-gradient(closest-side, rgba(94,234,212,.2), transparent 70%);
      }
      .top { display: flex; align-items: center; position: relative; height: 56px; }
      .top svg { height: 56px; width: auto; }
      .mono { font-size: 15px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: rgba(248,250,252,.68); }
      h1 { position: relative; font-weight: 600; font-size: 84px; line-height: 1; letter-spacing: -.04em; max-width: 1040px; }
      h1 i { font-weight: 500; color: #5eead4; }
      .bottom { display: flex; justify-content: space-between; align-items: flex-end; position: relative; }
      .url { font-size: 22px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="orb"></div>
    <div class="top"><!--LOGO--></div>
    <h1>Solusi digital <i>&amp; AI</i> untuk bisnis yang siap tumbuh.</h1>
    <div class="bottom">
      <span class="mono">Website · Aplikasi · Sistem Terintegrasi · Konsultasi AI</span>
      <span class="url">innaka.dev</span>
    </div>
  </body>
</html>
